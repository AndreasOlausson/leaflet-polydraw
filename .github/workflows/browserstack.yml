name: BrowserStack smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Leaflet.Polydraw/src/**"
      - "Leaflet.Polydraw/demo/**"
      - "Leaflet.Polydraw/test/playwright/**"
      - "Leaflet.Polydraw/package.json"
      - "Leaflet.Polydraw/package-lock.json"
      - "Leaflet.Polydraw/playwright.browserstack.config.ts"
      - ".github/workflows/browserstack.yml"
  pull_request:
    branches: [main]
    paths:
      - "Leaflet.Polydraw/src/**"
      - "Leaflet.Polydraw/demo/**"
      - "Leaflet.Polydraw/test/playwright/**"
      - "Leaflet.Polydraw/package.json"
      - "Leaflet.Polydraw/package-lock.json"
      - "Leaflet.Polydraw/playwright.browserstack.config.ts"
      - ".github/workflows/browserstack.yml"

concurrency:
  group: browserstack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: ./Leaflet.Polydraw/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./Leaflet.Polydraw

      - name: Install demo dependencies
        run: npm ci --ignore-scripts
        working-directory: ./Leaflet.Polydraw/demo

      - name: Configure BrowserStack environment
        uses: browserstack/github-actions/setup-env@93aebce225b754566349151c0676b26b005e591b # v1.0.4
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          project-name: Leaflet.Polydraw
          build-name: ${{ github.event_name == 'push' && 'BrowserStack smoke' || 'BUILD_INFO' }}

      - name: Start BrowserStack Local
        uses: browserstack/github-actions/setup-local@93aebce225b754566349151c0676b26b005e591b # v1.0.4
        with:
          local-testing: start
          local-identifier: random

      - name: Run BrowserStack smoke tests
        run: npm run test:browserstack
        working-directory: ./Leaflet.Polydraw

      - name: Stop BrowserStack Local
        if: always()
        uses: browserstack/github-actions/setup-local@93aebce225b754566349151c0676b26b005e591b # v1.0.4
        with:
          local-testing: stop

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-playwright-report
          path: Leaflet.Polydraw/playwright-report/browserstack
          if-no-files-found: ignore
          retention-days: 14
