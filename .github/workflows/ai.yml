name: AI Pull Request Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_PR_REVIEW }}
      OPENROUTER_MODELS: qwen/qwen3-coder-next

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review PR with OpenRouter
        if: env.OPENROUTER_API_KEY != ''
        continue-on-error: true
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/openrouter-pr-review.mjs

      - name: Post review as PR comment
        if: env.OPENROUTER_API_KEY != '' && hashFiles('review.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ai-review
          path: review.md
